name: Build OnePlus 8T Kernel (Meteoric)

on:
  workflow_dispatch:  # manual trigger
  push:
    branches:
      - derp16-kebab-ksu-n-susfs

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xSiCxSmurf/kernel_oneplus_sm8250-meteoric
          ref: derp16-kebab-ksu-n-susfs

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            clang \
            llvm \
            lld \
            curl \
            zip \
            unzip \
            python3

      - name: Download Neutron Clang
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalog/releases/download/190324/neutron-clang-190324.tar.zst
          tar --zstd -xf neutron-clang-190324.tar.zst
          mv neutron-clang-* neutron-clang

      - name: Build kernel
        run: |
          export PATH=$HOME/toolchains/neutron-clang/bin:$PATH
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="CI"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            AnyKernel3/*.zip
            
