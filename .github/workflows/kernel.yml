#!/bin/bash

# Set default values for environment variables
KSU_ENABLED=${KSU_ENABLED:-N}
CLEAN_BUILD=${CLEAN_BUILD:-N}

# Process arguments
if [[ "$KSU_ENABLED" == "Y" ]]; then
    echo "KSU is enabled."
else
    echo "KSU is disabled."
fi

if [[ "$CLEAN_BUILD" == "Y" ]]; then
    echo "Performing a clean build."
else
    echo "Performing a normal build."
fi

