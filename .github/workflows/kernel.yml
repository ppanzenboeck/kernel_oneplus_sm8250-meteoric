name: Kernel CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gcc \
            git libssl-dev libncurses-dev lld llvm \
            python3 python3-distutils unzip wget zip

      - name: Setup ccache
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          ccache -M 2G
          ccache -z

      - name: Apply CI patches
        run: bash ./ci_patch.sh

      - name: Build kernel (Clang + ccache)
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC="ccache clang"

          # Suppress noisy warnings that Clang errors on
          EXTRA_FLAGS="-Wno-error=format \
          -Wno-error=misleading-indentation \
          -Wno-error=implicit-int \
          -Wno-error=array-bounds \
          -Wno-gnu-variable-sized-type-not-at-end"

          make -j$(nproc) O=out \
            CC="${CC}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KBUILD_CFLAGS="${EXTRA_FLAGS}" \
            KCFLAGS="${EXTRA_FLAGS}" \
            V=1
          ccache -s

      - name: Package kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel
          cp out/arch/arm64/boot/Image AnyKernel/
          cd AnyKernel
          zip -r9 ../kernel-build.zip ./*

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: kernel-build.zip
