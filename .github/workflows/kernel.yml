name: CI Build - OnePlus 8T (derp16-kebab-ksu-n-susfs)

on:
  push:
    branches: [ derp16-kebab-ksu-n-susfs ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo (with SSH for submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          submodules: recursive
          persist-credentials: false

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make coreutils bc bison flex libssl-dev libncurses-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld ccache git wget python3 python3-setuptools device-tree-compiler
          
          CPU_COUNT=$(nproc 2>/dev/null || grep -c ^processor /proc/cpuinfo || echo 1)
          echo "CPU_COUNT=$CPU_COUNT" >> $GITHUB_ENV

      - name: Setup Clang toolchain (mARkClang-17)
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          if [ ! -d "mARkClang-17" ]; then
            git clone --depth=1 https://github.com/mARk-android/mARkClang-17.git mARkClang-17
          fi
          echo "$HOME/toolchains/mARkClang-17/bin" >> $GITHUB_PATH
          clang --version

      - name: Make CI patch script (disable SELinux includes + small fixes)
        run: |
         cat > .github/ci_patch.sh <<'PATCH'
        #!/usr/bin/env bash
set -euo pipefail echo "=== CI patch: disabling SELinux includes & patching KernelSU warnings ==="

# Disable SELinux headers in CI
if [ -d security/selinux/include ]; then
  find security/selinux/include -type f -name "*.h" -print0 | \
    xargs -0 -n1 sed -i 's/#include "flask.h"/\/\* #include \"flask.h\" (disabled in CI) \*\//g' || true
fi

# Patch KernelSU MODULE_IMPORT_NS to avoid build errors in CI
if [ -f kernel/ksu.c ]; then
  sed -i 's/^[[:space:]]*MODULE_IMPORT_NS(.*);/\/\* MODULE_IMPORT_NS disabled in CI \*\//' kernel/ksu.c || true
fi

# Patch DAMON printk warning
if [ -f mm/damon/paddr.c ]; then
  sed -i 's/printk(\("[^"]*] reclaimed %lld pages\\n",[[:space:]]*applied\);/printk("[damon_reclaim] reclaimed %lu pages\\n", (unsigned long) applied);/' mm/damon/paddr.c || true
fi

# Patch fs/crypto/policy.c for f2fs boot check
if [ -f fs/crypto/policy.c ]; then
  perl -0777 -pe 's/if\s*\(\s*!strcmp\(boot,\s*SDHCI\)\s*&&\s*!strcmp\(file_system_type,\s*"f2fs"\)\s*\)\s*\n\s*return 0\s*;/if (!strcmp(boot, SDHCI) && !strcmp(file_system_type, "f2fs")) { \n                    return 0; \n                }/s' -i fs/crypto/policy.c || true
fi

# Disable SELinux in kernel defconfig
DEFCONF="arch/arm64/configs/vendor/meteoric_defconfig"
if [ -f "$DEFCONF" ]; then
  sed -i 's/^CONFIG_SECURITY_SELINUX=y$/# CONFIG_SECURITY_SELINUX is not set/' "$DEFCONF" || true
  sed -i 's/^CONFIG_SECURITY=y$/# CONFIG_SECURITY is not set/' "$DEFCONF" || true
fi

echo "=== CI patch script finished ==="
PATCH

          chmod +x .github/ci_patch.sh
          dos2unix .github/ci_patch.sh || true

      - name: Run CI patch script
        shell: bash
        run: |
          ./.github/ci_patch.sh
          git --no-pager diff --no-prefix | sed -n '1,200p' || true

      - name: Ensure submodules up-to-date
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive --depth=1 || true

      - name: Prepare kernel defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out vendor/meteoric_defconfig

      - name: Build kernel (Clang)
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${{ env.PATH }}
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          EXTRA_FLAGS="-Wno-error=format -Wno-error=misleading-indentation -Wno-error=implicit-int"
          make -j"${{ env.CPU_COUNT }}" O=out \
            CC="${CC}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KBUILD_CFLAGS="${EXTRA_FLAGS}" \
            XCFLAGS="${EXTRA_FLAGS}" \
            V=1

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KernelSU-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Kernel
          path: KernelSU-Kernel.zip
