name: Build Kernel

on:
  push:
    branches:
      - derp16-kebab-ksu-n-susfs
  workflow_dispatch:
    inputs:
      ksu_enabled:
        description: 'Enable KernelSU'
        required: true
        default: 'N'
        type: choice
        options:
          - 'Y'
          - 'N'
      clean_build:
        description: 'Perform clean build'
        required: true
        default: 'N'
        type: choice
        options:
          - 'Y'
          - 'N'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex openssl libssl-dev curl perl zip
      
      - name: Build Kernel
        env:
          KSU_ENABLED: ${{ inputs.ksu_enabled || 'N' }}
          CLEAN_BUILD: ${{ inputs.clean_build || 'N' }}
        run: bash scripts/build-kernel.sh
      
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: out/*.zip