name: Build OnePlus 8T Kernel (Meteoric)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Checkout kernel source via SSH
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xSiCxSmurf/kernel_oneplus_sm8250-meteoric
          ref: derp16-kebab-ksu-n-susfs
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git libncurses5-dev libssl-dev python3 python3-pip unzip zip zstd

      # Download mARkClang-17 toolchain
      - name: Setup Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 git@github.com:mARk-android/mARkClang-17.git clang

      # Export build environment
      - name: Set environment
        run: |
          echo "PATH=$HOME/toolchains/clang/bin:$PATH" >> $GITHUB_ENV
          echo "KERNEL_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV_
          
