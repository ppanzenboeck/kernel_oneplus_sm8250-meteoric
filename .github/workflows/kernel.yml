name: Build OnePlus 8T Kernel with KernelSU

on:
  push:
    branches:
      - derp16-kebab-ksu-n-susfs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
  
    

    steps:
    - name: Checkout repository with submodules via SSH
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
        persist-credentials: false

    - name: Set up environment variables
      run: |
        echo "PATH=$HOME/toolchains/clang/bin:$PATH" >> $GITHUB_ENV
        echo "KERNEL_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential bc curl git flex bison libssl-dev libncurses5-dev ccache python3 python3-distutils zip

    - name: Setup toolchain
      run:
      
