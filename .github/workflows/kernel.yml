name: CI Build - OnePlus 8T (derp16-kebab-ksu-n-susfs)

on:
  push:
    branches: [ derp16-kebab-ksu-n-susfs ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with SSH for submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          submodules: recursive
          persist-credentials: false

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make coreutils bc bison flex libssl-dev \
            libncurses-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld ccache git wget python3 python3-setuptools \
            device-tree-compiler

          echo "make: $(which make || echo 'MISSING')"
          echo "nproc: $(which nproc || echo 'MISSING')"
          nproc || echo "nproc command not found (fallback will be used)"
          CPU_COUNT=$(nproc 2>/dev/null || grep -c ^processor /proc/cpuinfo || echo 1)
          echo "CPU_COUNT=$CPU_COUNT" >> $GITHUB_ENV

      - name: Setup Clang toolchain (mARkClang-17)
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          if [ ! -d "mARkClang-17" ]; then
            git clone --depth=1 https://github.com/mARk-android/mARkClang-17.git mARkClang-17
          fi
          echo "$HOME/toolchains/mARkClang-17/bin" >> $GITHUB_PATH
          clang --version

      - name: Apply CI patch script
        run: |
          ./.github/ci_patch.sh
          git --no-pager diff --no-prefix | sed -n '1,200p' || true

      - name: Ensure submodules up-to-date
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive --depth=1 || true

      - name: Check device tree overlays for errors
        run: |
          set -e
          echo "Checking all DTS/DTI files..."
          find arch/arm64/boot/dts/vendor/ -type f \( -name '*.dts' -o -name '*.dtsi' \) | while read f; do
            echo "Checking $f..."
            ./scripts/dtc/dtc -I dts -O dtb -o /tmp/test.dtbo "$f"
          done
          echo "All DTS/DTI files compiled successfully."

      - name: Prepare kernel defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out mrproper
          make O=out vendor/meteoric_defconfig

      - name: Build kernel (Clang)
        env:
          PATH: ${{ env.PATH }}
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          EXTRA_FLAGS="-Wno-error=format -Wno-error=misleading-indentation -Wno-error=implicit-int"
          make -j"${{ env.CPU_COUNT }}" O=out \
            CC="${CC}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KBUILD_CFLAGS="${EXTRA_FLAGS}" \
            XCFLAGS="${EXTRA_FLAGS}" \
            V=1

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../KernelSU-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Kernel
          path: KernelSU-Kernel.zip
