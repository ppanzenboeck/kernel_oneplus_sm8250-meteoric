name: Build Kernel

on:
  push:
    branches:
      - derp16-kebab-ksu-n-susfs
  workflow_dispatch:
    inputs:
      ksu_enabled:
        description: 'Enable KernelSU'
        required: true
        default: 'N'
        type: choice
        options:
          - 'Y'
          - 'N'
      clean_build:
        description: 'Perform clean build'
        required: true
        default: 'N'
        type: choice
        options:
          - 'Y'
          - 'N'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # We set submodules to false initially to fix the SSH/Pointer issue manually
          submodules: false
          fetch-depth: 1

      - name: Fix Submodules and Sync
        run: |
          # Convert SSH URLs to HTTPS for the CI runner
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git submodule sync
          # Update submodules, ignoring the broken commit pointer by fetching latest
          git submodule update --init --recursive --remote --depth 1

      - name: Patch Source Code
        run: |
          echo "Applying fixes for Damon and Kexec..."

          # 1. Fix missing task_struct headers in mm/damon/core.c
          sed -i '1i #include <linux/sched.h>' mm/damon/core.c
          sed -i '2i #include <linux/sched/task.h>' mm/damon/core.c

          # 2. Fix conflicting types for cpu_soft_restart in arch/arm64/kernel/cpu-reset.h
          # We change the inline definition to match the 2-argument declaration
          sed -i 's/cpu_soft_restart(unsigned long entry,.*)/cpu_soft_restart(phys_addr_t entry, unsigned long arg1)/' arch/arm64/kernel/cpu-reset.h
          
          # 3. Fix the previously found typo 'free_areai'
          sed -i 's/free_areai/free_area/g' mm/page_alloc.c

          # 4. Remove the git lock if it exists
          rm -f .git/shallow.lock
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex openssl libssl-dev \
          curl perl libelf-dev zip clang lld llvm gcc-aarch64-linux-gnu

 
      - name: Patch Source Code
        run: |
          echo "Applying fixes for known source errors..."
          # 1. Fix the typo 'free_areai' -> 'free_area'
          sed -i 's/free_areai/free_area/g' mm/page_alloc.c
          
          # 2. Fix the DAMON format string warning
          sed -i 's/%lld pages/%ld pages/g' mm/damon/paddr.c
          
          # 3. Add missing header for vsyscall if it exists (prevents implicit declaration error)
          if [ -f arch/x86/entry/vsyscall/vsyscall_64.c ]; then
            sed -i '1i #include <linux/syscalls.h>' arch/x86/entry/vsyscall/vsyscall_64.c
          fi

      - name: Build Kernel
        env:
          KSU_ENABLED: ${{ github.event.inputs.ksu_enabled || 'N' }}
          CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'N' }}
          # Force the build system to target the phone's CPU architecture
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          # Ensure git doesn't error on directory ownership
          git config --global --add safe.directory $GITHUB_WORKSPACE
          # Clean up any leftover lock files
          rm -f .git/shallow.lock
          bash scripts/build-kernel.sh

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: out/*.zip
