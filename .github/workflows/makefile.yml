name: CI Build - OnePlus 8T (derp16-kebab-ksu-n-susfs)
on:
  push:
    branches: [ derp16-kebab-ksu-n-susfs ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo (with SSH for submodules)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
        submodules: recursive
        persist-credentials: false

    - name: Start SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git wget tar make bc build-essential ccache coreutils \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          flex bison libssl-dev libncurses5-dev \
          python3 unzip zip zstd rsync

    - name: Setup Clang toolchain (mARkClang-17)
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        if [ ! -d "mARkClang-17" ]; then
          git clone --depth=1 https://github.com/mARk-android/mARkClang-17.git mARkClang-17
        fi
        echo "$HOME/toolchains/mARkClang-17/bin" >> $GITHUB_PATH

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure ccache
      run: |
        export CCACHE_DIR=~/.ccache
        ccache --max-size=2G
        ccache -z
        echo "export PATH=/usr/lib/ccache:\$PATH" >> $GITHUB_ENV

    - name: Make CI patch script
      run: |
        cat > .github/ci_patch.sh <<'PATCH'
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== CI patch script running ==="
        # Disable flask.h includes
        find security/selinux/include -type f -name "*.h" -exec sed -i 's/#include "flask.h"/\/\* disabled for CI \*\//' {} +
        # Disable KernelSU MODULE_IMPORT_NS
        sed -i 's/^.*MODULE_IMPORT_NS(.*);/\/\* MODULE_IMPORT_NS disabled in CI \*\//' kernel/ksu.c || true
        # Fix printk format
        sed -i 's/%lld/%lu/' mm/damon/paddr.c || true
        # Disable SELinux in vendor defconfig
        DEFCONF="arch/arm64/configs/vendor/meteoric_defconfig"
        if [ -f "$DEFCONF" ]; then
          sed -i 's/^CONFIG_SECURITY_SELINUX=y/# CONFIG_SECURITY_SELINUX is not set/' "$DEFCONF"
        fi
        echo "=== CI patch script finished ==="
        PATCH
        chmod +x .github/ci_patch.sh

    - name: Run CI patch script
      run: ./.github/ci_patch.sh

    - name: Ensure submodules updated
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --depth=1

    - name: Prepare kernel defconfig
      run: |
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        make O=out vendor/meteoric_defconfig

    - name: Build kernel (Clang + ccache)
      run: |
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC="ccache clang"
        EXTRA_FLAGS="-Wno-error=format -Wno-error=misleading-indentation -Wno-error=implicit-int"
        make -j$(nproc) O=out \
          CC="${CC}" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          KBUILD_CFLAGS="${EXTRA_FLAGS}" \
          XCFLAGS="${EXTRA_FLAGS}" \
          V=1
        ccache -s

    - name: Package AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3 && zip -r9 ../KernelSU-Kernel.zip *

    - name: Build boot.img
      run: |
        wget -O stock-boot.img https://example.com/boot.img  # replace with real stock boot
        git clone --depth=1 https://github.com/osm0sis/mkbootimg
        ./mkbootimg/unpackbootimg stock-boot.img out_boot
        cp out/arch/arm64/boot/Image out_boot/kernel
        ./mkbootimg/mkbootimg --kernel out_boot/kernel --ramdisk out_boot/ramdisk.cpio.gz \
          --base $(cat out_boot/base) --pagesize $(cat out_boot/pagesize) \
          -o new-boot.img

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Build
        path: |
          KernelSU-Kernel.zip
          new-boot.img
          
